<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D20bench Replay Viewer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header class="sidebar-head">
      <h1>D20bench<span>Replays</span></h1>
    </header>
    <div class="picker">
      <label for="season-select">Season</label>
      <select id="season-select"></select>
      <input id="match-filter" type="search" placeholder="Filter matches...">
    </div>
    <ul id="match-list" class="match-list"></ul>
  </aside>

  <main class="stage">
    <header id="match-header" class="match-header">
      <div class="mh-empty">Pick a match to watch its replay.</div>
    </header>
    <div class="board-wrap">
      <canvas id="board"></canvas>
    </div>
    <div class="transport">
      <button id="btn-restart" title="Restart">&#9198;</button>
      <button id="btn-back" title="Previous action">&#9194;</button>
      <button id="btn-play" class="primary" title="Play / pause">&#9654;</button>
      <button id="btn-fwd" title="Next action">&#9193;</button>
      <div class="speed">
        <button data-speed="1" class="speed-btn active">1x</button>
        <button data-speed="2" class="speed-btn">2x</button>
        <button data-speed="4" class="speed-btn">4x</button>
        <button data-speed="8" class="speed-btn">8x</button>
      </div>
      <input id="scrubber" type="range" min="0" max="0" value="0" step="1">
      <div id="round-indicator" class="round-indicator">-</div>
    </div>
  </main>

  <aside class="detail">
    <section class="decision-card" id="decision-card">
      <h2>Decision</h2>
      <div id="decision-body" class="decision-body">
        <div class="mh-empty">Actions will appear here during playback.</div>
      </div>
    </section>
    <section class="log-panel">
      <h2>Combat log</h2>
      <div id="battle-log" class="battle-log"></div>
    </section>
  </aside>
</div>
<script src="data/index.js"></script>
<script src="app.js"></script>
</body>
</html>
